<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Матрица судьбы</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:#f5f5f7;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
color:#222;
padding:20px;
}

.app{
max-width:430px;
margin:auto;
}

h1{
font-size:34px;
font-weight:700;
margin-bottom:20px;
}

input,button{
width:100%;
height:56px;
border:none;
border-radius:16px;
font-size:18px;
}

input{
padding:0 16px;
background:white;
margin-bottom:12px;
}

button{
background:linear-gradient(135deg,#6c4cff,#8f6bff);
color:white;
font-weight:700;
margin-bottom:25px;
}

.hidden{
display:none;
}

/* MATRIX */

.matrix{
position:relative;
width:360px;
height:360px;
margin:0 auto 30px;
}

.circle{
position:absolute;
inset:0;
border:2px solid #c9b89c;
border-radius:50%;
}

.line{
position:absolute;
background:#c9b89c;
}

.h{
width:280px;
height:1px;
left:40px;
top:180px;
}

.v{
height:280px;
width:1px;
left:180px;
top:40px;
}

.d1{
width:1px;
height:300px;
left:180px;
top:30px;
transform:rotate(45deg);
}

.d2{
width:1px;
height:300px;
left:180px;
top:30px;
transform:rotate(-45deg);
}

.node{
position:absolute;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
color:#222;
}

/* основные */

.left{
width:70px;
height:70px;
background:#d8cae8;
left:0;
top:145px;
}

.top{
width:70px;
height:70px;
background:#d8cae8;
left:145px;
top:0;
}

.right{
width:70px;
height:70px;
background:#f3aaa5;
right:0;
top:145px;
}

.bottom{
width:70px;
height:70px;
background:#f3aaa5;
left:145px;
bottom:0;
}

.center{
width:72px;
height:72px;
background:#b9c9ad;
left:144px;
top:144px;
font-size:30px;
}

/* дополнительные */

.blue{
width:46px;
height:46px;
background:#b7ceda;
font-size:20px;
}

.light{
width:46px;
height:46px;
background:#d4e4ef;
font-size:20px;
}

/* карточки */

.card{
padding:18px;
border-radius:22px;
margin-bottom:14px;
line-height:1.5;
}

.card h3{
margin-bottom:10px;
font-size:22px;
}

.purpleCard{
background:#efe7f8;
}

.redCard{
background:#fde8e6;
}

.yellowCard{
background:#fff3cc;
}

.blueCard{
background:#e2eef5;
}

.plus{
color:#2e7d32;
font-weight:600;
}

.minus{
color:#c62828;
font-weight:600;
}

</style>
</head>

<body>

<div class="app">

<h1>Матрица судьбы</h1>

<input 
id="dateInput" 
placeholder="ДД.ММ.ГГГГ"
maxlength="10"
/>

<button id="calcBtn">
Рассчитать
</button>

<div id="matrix" class="matrix hidden">

<div class="circle"></div>

<div class="line h"></div>
<div class="line v"></div>
<div class="line d1"></div>
<div class="line d2"></div>

</div>

<div id="info"></div>

</div>

<script>

// автоформат даты

dateInput.addEventListener("input",e=>{

let v=e.target.value.replace(/\D/g,"");

if(v.length>2){
v=v.slice(0,2)+"."+v.slice(2);
}

if(v.length>5){
v=v.slice(0,5)+"."+v.slice(5,9);
}

e.target.value=v;

});

// редукция

function reduce(num){

while(num>22){

num=num
.toString()
.split("")
.reduce((a,b)=>a+Number(b),0);

}

return num;

}

// энергии

const energies={

1:["Маг","лидерство, инициатива","эгоизм, манипуляции"],
2:["Жрица","интуиция, мудрость","страхи, закрытость"],
3:["Императрица","творчество, изобилие","лень, инфантильность"],
4:["Император","сила, структура","контроль, жесткость"],
5:["Иерофант","знания, наставничество","догматизм"],
6:["Влюблённые","любовь, гармония","зависимость"],
7:["Колесница","движение, победа","агрессия"],
8:["Справедливость","баланс","критика"],
9:["Отшельник","мудрость","одиночество"],
10:["Колесо Фортуны","удача","хаос"],
11:["Сила","харизма, энергия","давление"],
12:["Повешенный","духовный рост","жертвенность"],
13:["Смерть","трансформация","страх перемен"],
14:["Умеренность","гармония","пассивность"],
15:["Дьявол","деньги, влияние","зависимости"],
16:["Башня","перезагрузка","разрушение"],
17:["Звезда","вдохновение","иллюзии"],
18:["Луна","чувствительность","тревожность"],
19:["Солнце","успех","гордыня"],
20:["Суд","пробуждение","осуждение"],
21:["Мир","завершение","застой"],
22:["Шут","свобода","хаос"]

};

// карточка

function createCard(title,num,color,desc){

const e=energies[num];

return `
<div class="card ${color}">
<h3>${title} — ${num}</h3>

<div><b>Аркан:</b> ${e[0]}</div><br>

<div class="plus">
Плюс: ${e[1]}
</div><br>

<div class="minus">
Минус: ${e[2]}
</div>

${desc ? `<br><div>${desc}</div>` : ""}

</div>
`;

}

// расчёт

calcBtn.onclick=()=>{

const val=dateInput.value;

if(val.length!==10){

alert("Введите дату");

return;

}

const parts=val.split(".");

let day=reduce(Number(parts[0]));
let month=reduce(Number(parts[1]));

let year=parts[2]
.split("")
.reduce((a,b)=>a+Number(b),0);

year=reduce(year);

// кармическая задача

let karma=reduce(day+month+year);

// центр

let center=reduce(
day+month+year+karma
);

// ДОП ТОЧКИ

// ЛЕВАЯ

let leftLight=reduce(day+center);

let leftBlue=reduce(day+leftLight);

// ВЕРХНЯЯ

let topLight=reduce(month+center);

let topBlue=reduce(month+topLight);

// ПРАВАЯ

let rightLight=reduce(year+center);

let rightBlue=reduce(year+rightLight);

// НИЖНЯЯ

let bottomLight=reduce(karma+center);

let bottomBlue=reduce(karma+bottomLight);

// показать

matrix.classList.remove("hidden");

matrix.innerHTML=`

<div class="circle"></div>

<div class="line h"></div>
<div class="line v"></div>
<div class="line d1"></div>
<div class="line d2"></div>

<!-- основные -->

<div class="node left">${day}</div>
<div class="node top">${month}</div>
<div class="node right">${year}</div>
<div class="node bottom">${karma}</div>
<div class="node center">${center}</div>

<!-- лево -->

<div 
class="node blue"
style="
left:70px;
top:157px;
"
>
${leftBlue}
</div>

<div 
class="node light"
style="
left:112px;
top:157px;
"
>
${leftLight}
</div>

<!-- верх -->

<div 
class="node blue"
style="
left:157px;
top:72px;
"
>
${topBlue}
</div>

<div 
class="node light"
style="
left:157px;
top:115px;
"
>
${topLight}
</div>

<!-- право -->

<div 
class="node light"
style="
right:112px;
top:157px;
"
>
${rightLight}
</div>

<div 
class="node blue"
style="
right:70px;
top:157px;
"
>
${rightBlue}
</div>

<!-- низ -->

<div 
class="node light"
style="
left:157px;
bottom:112px;
"
>
${bottomLight}
</div>

<div 
class="node blue"
style="
left:157px;
bottom:70px;
"
>
${bottomBlue}
</div>

`;

info.innerHTML=

createCard(
"Визитная карточка",
day,
"purpleCard"
)

+

createCard(
"Главный талант",
month,
"purpleCard"
)

+

createCard(
"Материальная карма",
year,
"redCard"
)

+

createCard(
"Кармическая задача",
karma,
"redCard"
)

+

createCard(
"Комфорт души",
center,
"yellowCard"
)

+

createCard(
"Голубая точка слева",
leftLight,
"blueCard",
`${day} + ${center} = ${leftLight}`
)

+

createCard(
"Синяя точка слева",
leftBlue,
"blueCard",
`${day} + ${leftLight} = ${leftBlue}`
)

+

createCard(
"Голубая точка сверху",
topLight,
"blueCard",
`${month} + ${center} = ${topLight}`
)

+

createCard(
"Синяя точка сверху",
topBlue,
"blueCard",
`${month} + ${topLight} = ${topBlue}`
)

+

createCard(
"Голубая точка справа",
rightLight,
"blueCard",
`${year} + ${center} = ${rightLight}`
)

+

createCard(
"Синяя точка справа",
rightBlue,
"blueCard",
`${year} + ${rightLight} = ${rightBlue}`
)

+

createCard(
"Голубая точка снизу",
bottomLight,
"blueCard",
`${karma} + ${center} = ${bottomLight}`
)

+

createCard(
"Синяя точка снизу",
bottomBlue,
"blueCard",
`${karma} + ${bottomLight} = ${bottomBlue}`
);

};

</script>

</body>
</html>
