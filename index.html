<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица судьбы</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f5f5f7;
  font-family: -apple-system, sans-serif;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

/* одинаковый размер */
input, button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

input {
  background: white;
}

button {
  background: #007aff;
  color: white;
  font-weight: bold;
}

/* матрица */
.circle {
  position: relative;
  width: 320px;
  height: 320px;
  margin: 30px auto;
  border-radius: 50%;
  border: 2px solid #d2c2a3;
}

/* скрыто */
.hidden { display: none; }

/* точки */
.node {
  position: absolute;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#000;
}

.left { background:#d1c4e9; }
.top { background:#d1c4e9; }
.right { background:#ef9a9a; }
.bottom { background:#ef9a9a; }
.center { background:#ffe082; width:54px;height:54px; }

/* блоки */
.card {
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
  color: #000;
}

.purple { background:#ede7f6; }
.red { background:#ffebee; }
.yellow { background:#fff8e1; }

.plus { color:green; }
.minus { color:red; }

</style>
</head>

<body>

<div class="app">

<h1>Матрица судьбы</h1>

<input id="dateInput" placeholder="ДД.ММ.ГГГГ">
<button id="btn">Рассчитать</button>

<div id="matrix" class="circle hidden"></div>
<div id="info"></div>

</div>

<script>

// автоформат даты
dateInput.addEventListener("input", e=>{
 let v=e.target.value.replace(/\D/g,"");
 if(v.length>2)v=v.slice(0,2)+"."+v.slice(2);
 if(v.length>5)v=v.slice(0,5)+"."+v.slice(5,9);
 e.target.value=v;
});

// редукция до 22
function reduce(n){
 while(n > 22){
  n = n.toString().split("").reduce((a,b)=>a+ +b,0);
 }
 return n;
}

// энергии
const E = {
1:["Маг","Лидерство, инициатива","Манипуляции, эго"],
2:["Жрица","Интуиция, глубина","Страхи, закрытость"],
3:["Императрица","Творчество, изобилие","Лень"],
4:["Император","Структура, сила","Контроль"],
5:["Иерофант","Знания, наставник","Догмы"],
6:["Влюблённые","Любовь, гармония","Зависимость"],
7:["Колесница","Победа, цель","Агрессия"],
8:["Справедливость","Баланс","Критика"],
9:["Отшельник","Мудрость","Одиночество"],
10:["Фортуна","Удача","Нестабильность"],
11:["Сила","Энергия","Гнев"],
12:["Повешенный","Рост","Жертва"],
13:["Смерть","Трансформация","Страх"],
14:["Умеренность","Гармония","Пассивность"],
15:["Дьявол","Деньги","Зависимости"],
16:["Башня","Перезапуск","Кризис"],
17:["Звезда","Мечты","Иллюзии"],
18:["Луна","Интуиция","Страхи"],
19:["Солнце","Успех","Эго"],
20:["Суд","Пробуждение","Страх"],
21:["Мир","Завершение","Застой"],
22:["Шут","Свобода","Хаос"]
};

// расчёт
btn.onclick = () => {

 let p = dateInput.value.split(".");
 if(p.length !== 3){
  alert("Введите дату");
  return;
 }

 let d = reduce(+p[0]);
 let m = reduce(+p[1]);
 let y = reduce(p[2].split("").reduce((a,b)=>a+ +b,0));

 let karma = reduce(d+m+y);
 let center = reduce(d+m+y+karma);

 matrix.innerHTML = "";
 matrix.classList.remove("hidden");

 // позиции
 const pos = {
  left:[0,140],
  top:[140,0],
  right:[280,140],
  bottom:[140,280],
  center:[133,133]
 };

 function add(val,cls,x,y){
  let el=document.createElement("div");
  el.className="node "+cls;
  el.style.left=x+"px";
  el.style.top=y+"px";
  el.innerText=val;
  matrix.appendChild(el);
 }

 add(d,"left",...pos.left);
 add(m,"top",...pos.top);
 add(y,"right",...pos.right);
 add(karma,"bottom",...pos.bottom);
 add(center,"center",...pos.center);

 function block(title,n,color){
  let a=E[n];
  return `
  <div class="card ${color}">
    <b>${title}: ${n}</b><br><br>
    <span class="plus">Плюс: ${a[1]}</span><br><br>
    <span class="minus">Минус: ${a[2]}</span>
  </div>`;
 }

 info.innerHTML =
  block("Визитная карточка (день)",d,"purple") +
  block("Главный талант (месяц)",m,"purple") +
  block("Материальная карма (год)",y,"red") +
  block("Кармическая задача",karma,"red") +
  block("Комфорт души (центр)",center,"yellow");

}
</script>

</body>
</html>
