<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица судьбы PRO MAX</title>

<style>
body {
  margin: 0;
  background: #f5f5f7;
  font-family: -apple-system, sans-serif;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

h1 { text-align: center; }

input, button {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: #007aff;
  color: white;
}

/* круг */
.circle {
  position: relative;
  width: 320px;
  height: 320px;
  margin: 30px auto;
  border-radius: 50%;
  border: 2px solid #d2c2a3;
}

/* линии */
.line {
  position: absolute;
  background: #d2c2a3;
}

.h { width:100%; height:1px; top:50%; }
.v { height:100%; width:1px; left:50%; }
.d1 { height:100%; width:1px; transform:rotate(45deg); left:50%; }
.d2 { height:100%; width:1px; transform:rotate(-45deg); left:50%; }

/* точки */
.node {
  position: absolute;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
}

/* цвета как на картинке */
.c1 { background:#cfd8dc; }
.c2 { background:#b0bec5; }
.c3 { background:#aed581; }
.c4 { background:#ffcc80; }
.c5 { background:#ef9a9a; }
.c6 { background:#d1c4e9; }

.center {
  width:50px;
  height:50px;
  font-size:16px;
}

/* карточки */
.card {
  background:white;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.hidden { display:none; }

</style>
</head>

<body>

<div class="app">

<h1>Матрица судьбы</h1>

<input id="dateInput" placeholder="ДД.ММ.ГГГГ">
<button id="btn">Рассчитать</button>

<div id="matrix" class="circle hidden">
  <div class="line h"></div>
  <div class="line v"></div>
  <div class="line d1"></div>
  <div class="line d2"></div>
</div>

<div id="info"></div>

</div>

<script>

// автоформат
dateInput.addEventListener("input", e=>{
 let v=e.target.value.replace(/\D/g,"");
 if(v.length>2)v=v.slice(0,2)+"."+v.slice(2);
 if(v.length>5)v=v.slice(0,5)+"."+v.slice(5,9);
 e.target.value=v;
});

// редукция
function r(n){
 while(n>22)n=[...n+""].reduce((a,b)=>a+ +b,0);
 return n;
}

// расчет
btn.onclick=()=>{

 let p=dateInput.value.split(".");
 if(p.length!==3){alert("Введите дату");return;}

 let d=r(+p[0]);
 let m=r(+p[1]);
 let y=r(+p[2]);

 let destiny=r(d+m+y);
 let purpose=r(d+y);
 let money=r(d+m);
 let love=r(m+y);

 let center=r(destiny+purpose);

 // дополнительные точки (приближение к схеме)
 let t1=r(destiny+money);
 let t2=r(destiny+love);
 let t3=r(purpose+money);
 let t4=r(purpose+love);

 matrix.classList.remove("hidden");
 matrix.querySelectorAll(".node").forEach(n=>n.remove());

 // позиции (как на картинке)
 const pos = [
  [140,0],    // верх
  [260,70],   // правый верх
  [260,200],  // правый низ
  [140,280],  // низ
  [20,200],   // левый низ
  [20,70],    // левый верх
  [140,140],  // центр

  [90,90],
  [200,90],
  [200,200],
  [90,200]
 ];

 const values = [
  destiny,
  money,
  love,
  purpose,
  d,
  m,
  center,
  t1,
  t2,
  t3,
  t4
 ];

 const colors = [
  "c6","c4","c5","c4","c2","c2","c3",
  "c2","c2","c4","c5"
 ];

 values.forEach((n,i)=>{
  let el=document.createElement("div");
  el.className="node "+colors[i]+(i===6?" center":"");
  el.style.left=pos[i][0]+"px";
  el.style.top=pos[i][1]+"px";
  el.innerText=n;
  matrix.appendChild(el);
 });

 // инфо
 info.innerHTML = `
 <div class="card"><b>Судьба:</b> ${destiny}</div>
 <div class="card"><b>Деньги:</b> ${money}</div>
 <div class="card"><b>Любовь:</b> ${love}</div>
 <div class="card"><b>Предназначение:</b> ${purpose}</div>
 <div class="card"><b>Центр личности:</b> ${center}</div>
 `;
}

</script>

</body>
</html>
