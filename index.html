<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица судьбы</title>

<style>
body {
  margin: 0;
  background: #1c1c1e;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* fullscreen app */
.iphone {
  width: 100%;
  height: 100vh;
  background: #f2f2f7;
  overflow: auto;
}

/* status bar */
.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  font-size: 14px;
}

/* content */
.app {
  padding: 20px;
}

h1 {
  text-align: center;
}

/* cards */
.card {
  background: rgba(255,255,255,0.9);
  padding: 15px;
  border-radius: 18px;
  margin-top: 15px;
}

/* input */
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
  font-size: 16px;
}

/* button */
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #007aff;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 16px;
}

/* result */
.hidden {
  display: none;
}

.big-number {
  font-size: 50px;
  text-align: center;
  font-weight: bold;
}

/* matrix */
.matrix {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.matrix div {
  background: white;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
}

/* meanings */
.meaning {
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="iphone">

  <div class="status-bar">
    <span id="time"></span>
    <span>📶 🔋</span>
  </div>

  <div class="app">
    <h1>Матрица судьбы</h1>

    <div class="card">
      <label>Дата рождения</label>
      <input id="dateInput" placeholder="ДД.ММ.ГГГГ" maxlength="10">
    </div>

    <button id="calcBtn">Рассчитать</button>

    <div id="result" class="hidden">

      <div class="card">
        <h3>Число судьбы</h3>
        <div class="big-number" id="destiny"></div>
        <div class="meaning" id="destinyMeaning"></div>
      </div>

      <div class="card">
        <h3>Матрица</h3>
        <div class="matrix" id="matrix"></div>
      </div>

    </div>

  </div>
</div>

<script>

// 🔥 время как на iPhone
function updateTime() {
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  document.getElementById("time").innerText = time;
}
setInterval(updateTime, 1000);
updateTime();

// 🔥 автоформат даты
const input = document.getElementById("dateInput");

input.addEventListener("input", (e) => {
  let v = e.target.value.replace(/\D/g, "");

  if (v.length > 2) v = v.slice(0,2) + "." + v.slice(2);
  if (v.length > 5) v = v.slice(0,5) + "." + v.slice(5,9);

  e.target.value = v;
});

// 🔢 значения (расшифровка)
const meanings = {
  1: "Лидерство, сила воли",
  2: "Интуиция, чувствительность",
  3: "Творчество, самовыражение",
  4: "Стабильность, труд",
  5: "Свобода, перемены",
  6: "Любовь, семья",
  7: "Духовность, поиск истины",
  8: "Сила, деньги, контроль",
  9: "Мудрость, завершение",
  10: "Удача, поток",
  11: "Сила духа",
  12: "Жертвенность",
  13: "Трансформация",
  14: "Баланс",
  15: "Искушение",
  16: "Разрушение старого",
  17: "Надежда",
  18: "Подсознание",
  19: "Успех",
  20: "Пробуждение",
  21: "Завершение",
  22: "Свобода души"
};

// уменьшение
function reduceTo22(num) {
  while (num > 22) {
    num = num.toString().split("").reduce((s, d) => s + +d, 0);
  }
  return num;
}

// расчёт
document.getElementById("calcBtn").addEventListener("click", () => {

  const date = input.value;
  const parts = date.split(".");

  if (parts.length !== 3) {
    alert("Введите дату правильно");
    return;
  }

  const d = reduceTo22(+parts[0]);
  const m = reduceTo22(+parts[1]);
  const y = reduceTo22(+parts[2]);

  const destiny = reduceTo22(d + m + y);

  document.getElementById("destiny").innerText = destiny;
  document.getElementById("destinyMeaning").innerText =
    meanings[destiny] || "Описание отсутствует";

  const matrix = [d, m, y, destiny];

  const box = document.getElementById("matrix");
  box.innerHTML = "";

  matrix.forEach(n => {
    const div = document.createElement("div");
    div.innerHTML = `<b>${n}</b><br><small>${meanings[n] || ""}</small>`;
    box.appendChild(div);
  });

  document.getElementById("result").classList.remove("hidden");

});

</script>

</body>
</html>
