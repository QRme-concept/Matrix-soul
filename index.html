<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Матрица судьбы</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f5f5f7;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
padding:20px;
color:#222;
}

.app{
max-width:430px;
margin:auto;
}

h1{
font-size:34px;
font-weight:700;
margin-bottom:20px;
text-align:center;
}

input,
button{
width:100%;
height:56px;
border:none;
border-radius:18px;
font-size:18px;
}

input{
background:white;
padding:0 18px;
margin-bottom:12px;
}

button{
background:#6c4cff;
color:white;
font-weight:700;
margin-bottom:28px;
}

.hidden{
display:none;
}

/* МАТРИЦА */

.matrix{
position:relative;
width:360px;
height:360px;
margin:0 auto 30px;
}

/* круг */

.circle{
position:absolute;
inset:0;
border:2px solid #cbb89b;
border-radius:50%;
}

/* линии */

.line{
position:absolute;
background:#cbb89b;
}

.h{
width:280px;
height:1px;
left:40px;
top:180px;
}

.v{
width:1px;
height:280px;
left:180px;
top:40px;
}

.d1{
width:1px;
height:300px;
left:180px;
top:30px;
transform:rotate(45deg);
}

.d2{
width:1px;
height:300px;
left:180px;
top:30px;
transform:rotate(-45deg);
}

/* кружки */

.node{
position:absolute;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

/* основные */

.left{
width:64px;
height:64px;
background:#d8cae8;
left:0;
top:148px;
font-size:28px;
}

.top{
width:64px;
height:64px;
background:#d8cae8;
left:148px;
top:0;
font-size:28px;
}

.right{
width:64px;
height:64px;
background:#f3aaa5;
right:0;
top:148px;
font-size:28px;
}

.bottom{
width:64px;
height:64px;
background:#f3aaa5;
left:148px;
bottom:0;
font-size:28px;
}

/* центр */

.center{
width:72px;
height:72px;
background:#f5de8d;
left:144px;
top:144px;
font-size:30px;
}

/* нейтральные */

.neutral{
width:40px;
height:40px;
background:#edf2f5;
font-size:18px;
}

/* голубые */

.light{
width:40px;
height:40px;
background:#c9dce7;
font-size:18px;
}

/* оранжевые */

.orange{
width:40px;
height:40px;
background:#f6d2a3;
font-size:18px;
}

/* карточки */

.card{
padding:18px;
border-radius:22px;
margin-bottom:14px;
line-height:1.5;
}

.card h3{
margin-bottom:10px;
font-size:22px;
}

.purpleCard{
background:#f0e8f8;
}

.redCard{
background:#fde9e7;
}

.yellowCard{
background:#fff4cf;
}

.blueCard{
background:#e7f0f5;
}

.plus{
color:#2e7d32;
font-weight:600;
}

.minus{
color:#c62828;
font-weight:600;
}

</style>
</head>

<body>

<div class="app">

<h1>Матрица судьбы</h1>

<input
id="dateInput"
placeholder="ДД.ММ.ГГГГ"
maxlength="10"
/>

<button id="calcBtn">
Рассчитать
</button>

<div id="matrix" class="matrix hidden"></div>

<div id="info"></div>

</div>

<script>

// автоформат даты

dateInput.addEventListener("input",e=>{

let v=e.target.value.replace(/\D/g,"");

if(v.length>2){
v=v.slice(0,2)+"."+v.slice(2);
}

if(v.length>5){
v=v.slice(0,5)+"."+v.slice(5,9);
}

e.target.value=v;

});

// редукция

function reduce(num){

while(num>22){

num=num
.toString()
.split("")
.reduce((a,b)=>a+Number(b),0);

}

return num;

}

// энергии

const energies={

1:["Маг","лидерство, инициатива","эгоизм, манипуляции"],
2:["Жрица","интуиция, мудрость","страхи, закрытость"],
3:["Императрица","творчество, изобилие","лень"],
4:["Император","структура, сила","контроль"],
5:["Иерофант","знания, наставничество","догматизм"],
6:["Влюблённые","любовь, гармония","зависимость"],
7:["Колесница","движение, победа","агрессия"],
8:["Справедливость","баланс","критика"],
9:["Отшельник","мудрость","закрытость"],
10:["Колесо Фортуны","удача","хаос"],
11:["Сила","харизма","давление"],
12:["Повешенный","рост души","жертвенность"],
13:["Смерть","трансформация","страх перемен"],
14:["Умеренность","гармония","пассивность"],
15:["Дьявол","деньги, влияние","зависимости"],
16:["Башня","перезагрузка","разрушение"],
17:["Звезда","вдохновение","иллюзии"],
18:["Луна","чувствительность","тревожность"],
19:["Солнце","успех","гордыня"],
20:["Суд","пробуждение","осуждение"],
21:["Мир","завершение","застой"],
22:["Шут","свобода","хаос"]

};

// карточка

function createCard(title,num,color,text){

const e=energies[num];

return `
<div class="card ${color}">

<h3>${title} — ${num}</h3>

<div>
<b>Аркан:</b> ${e[0]}
</div>

<br>

<div class="plus">
Плюс: ${e[1]}
</div>

<br>

<div class="minus">
Минус: ${e[2]}
</div>

${text ? `<br><div>${text}</div>` : ""}

</div>
`;

}

// расчёт

calcBtn.onclick=()=>{

const val=dateInput.value;

if(val.length!==10){

alert("Введите дату");

return;

}

const parts=val.split(".");

// основные

let day=reduce(Number(parts[0]));

let month=reduce(Number(parts[1]));

let year=parts[2]
.split("")
.reduce((a,b)=>a+Number(b),0);

year=reduce(year);

// низ

let karma=reduce(day+month+year);

// центр

let center=reduce(
day+month+year+karma
);

// ЛЕВО

let leftLight=reduce(day+center);

let leftNeutral=reduce(day+leftLight);

// ВЕРХ

let topLight=reduce(month+center);

let topNeutral=reduce(month+topLight);

// ПРАВО

let rightOrange=reduce(year+center);

let rightNeutral=reduce(year+rightOrange);

// НИЗ

let bottomOrange=reduce(karma+center);

let bottomNeutral=reduce(karma+bottomOrange);

// показать

matrix.classList.remove("hidden");

matrix.innerHTML=`

<div class="circle"></div>

<div class="line h"></div>
<div class="line v"></div>
<div class="line d1"></div>
<div class="line d2"></div>

<!-- основные -->

<div class="node left">
${day}
</div>

<div class="node top">
${month}
</div>

<div class="node right">
${year}
</div>

<div class="node bottom">
${karma}
</div>

<div class="node center">
${center}
</div>

<!-- ЛЕВО -->

<div
class="node neutral"
style="
left:74px;
top:160px;
"
>
${leftNeutral}
</div>

<div
class="node light"
style="
left:114px;
top:160px;
"
>
${leftLight}
</div>

<!-- ВЕРХ -->

<div
class="node neutral"
style="
left:160px;
top:74px;
"
>
${topNeutral}
</div>

<div
class="node light"
style="
left:160px;
top:114px;
"
>
${topLight}
</div>

<!-- ПРАВО -->

<div
class="node orange"
style="
right:114px;
top:160px;
"
>
${rightOrange}
</div>

<div
class="node neutral"
style="
right:74px;
top:160px;
"
>
${rightNeutral}
</div>

<!-- НИЗ -->

<div
class="node orange"
style="
left:160px;
bottom:114px;
"
>
${bottomOrange}
</div>

<div
class="node neutral"
style="
left:160px;
bottom:74px;
"
>
${bottomNeutral}
</div>

`;

// карточки

info.innerHTML=

createCard(
"Визитная карточка",
day,
"purpleCard"
)

+

createCard(
"Главный талант",
month,
"purpleCard"
)

+

createCard(
"Материальная карма",
year,
"redCard"
)

+

createCard(
"Кармическая задача",
karma,
"redCard"
)

+

createCard(
"Комфорт души",
center,
"yellowCard"
)

+

createCard(
"Левая голубая энергия",
leftLight,
"blueCard",
`${day} + ${center} = ${leftLight}`
)

+

createCard(
"Левая нейтральная энергия",
leftNeutral,
"blueCard",
`${day} + ${leftLight} = ${leftNeutral}`
)

+

createCard(
"Верхняя голубая энергия",
topLight,
"blueCard",
`${month} + ${center} = ${topLight}`
)

+

createCard(
"Верхняя нейтральная энергия",
topNeutral,
"blueCard",
`${month} + ${topLight} = ${topNeutral}`
)

+

createCard(
"Правая оранжевая энергия",
rightOrange,
"yellowCard",
`${year} + ${center} = ${rightOrange}`
)

+

createCard(
"Правая нейтральная энергия",
rightNeutral,
"yellowCard",
`${year} + ${rightOrange} = ${rightNeutral}`
)

+

createCard(
"Нижняя оранжевая энергия",
bottomOrange,
"yellowCard",
`${karma} + ${center} = ${bottomOrange}`
)

+

createCard(
"Нижняя нейтральная энергия",
bottomNeutral,
"yellowCard",
`${karma} + ${bottomOrange} = ${bottomNeutral}`
);

};

</script>

</body>
</html>
