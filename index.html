<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица судьбы</title>

<style>
body {
  margin: 0;
  background: #1c1c1e;
  font-family: -apple-system, sans-serif;
}

.iphone {
  width: 100%;
  height: 100vh;
  background: #f2f2f7;
  overflow: auto;
}

.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
}

.app {
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.95);
  padding: 15px;
  border-radius: 18px;
  margin-top: 15px;
}

input, button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
}

button {
  background: #007aff;
  color: white;
}

.hidden { display: none; }

.big-number {
  font-size: 48px;
  text-align: center;
}

.meaning {
  font-size: 14px;
  margin-top: 10px;
}

.plus { color: green; }
.minus { color: red; }

</style>
</head>

<body>

<div class="iphone">

  <div class="status-bar">
    <span id="time"></span>
    <span>📶 🔋</span>
  </div>

  <div class="app">
    <h2>Матрица судьбы</h2>

    <div class="card">
      <input id="dateInput" placeholder="ДД.ММ.ГГГГ">
    </div>

    <button id="calcBtn">Рассчитать</button>

    <div id="result" class="hidden">

      <div class="card">
        <div class="big-number" id="destiny"></div>
        <div id="desc" class="meaning"></div>
      </div>

    </div>
  </div>
</div>

<script>

// время
setInterval(()=>{
  const now = new Date();
  document.getElementById("time").innerText =
    now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
},1000);

// автоформат
dateInput.addEventListener("input", e=>{
  let v = e.target.value.replace(/\D/g,"");
  if(v.length>2) v=v.slice(0,2)+"."+v.slice(2);
  if(v.length>5) v=v.slice(0,5)+"."+v.slice(5,9);
  e.target.value=v;
});

// база арканов
const arcana = {

1:{name:"Маг",
plus:"Лидер, инициатор, умеет создавать реальность, сильная воля и интеллект.",
minus:"Манипуляции, эгоизм, давление на людей, желание контролировать всё."},

2:{name:"Жрица",
plus:"Интуиция, глубина, мудрость, чувствительность к энергиям.",
minus:"Закрытость, страхи, пассивность, уход в иллюзии."},

3:{name:"Императрица",
plus:"Творчество, изобилие, забота, женская энергия.",
minus:"Лень, зависимость от комфорта, капризность."},

4:{name:"Император",
plus:"Сила, структура, ответственность, умение управлять.",
minus:"Жёсткость, контроль, тирания."},

5:{name:"Иерофант",
plus:"Мудрость, наставничество, духовность, знания.",
minus:"Догмы, ограниченность мышления."},

6:{name:"Влюблённые",
plus:"Любовь, выбор, гармония, отношения.",
minus:"Зависимость, сомнения, страх выбора."},

7:{name:"Колесница",
plus:"Цель, движение, победа, сила характера.",
minus:"Агрессия, спешка, давление."},

8:{name:"Справедливость",
plus:"Баланс, честность, карма.",
minus:"Осуждение, критика, холодность."},

9:{name:"Отшельник",
plus:"Мудрость, самопознание, глубина.",
minus:"Одиночество, закрытость."},

10:{name:"Колесо Фортуны",
plus:"Удача, поток, перемены.",
minus:"Нестабильность, зависимость от обстоятельств."},

11:{name:"Сила",
plus:"Внутренняя мощь, харизма, энергия.",
minus:"Гнев, подавление."},

12:{name:"Повешенный",
plus:"Переосмысление, духовный рост.",
minus:"Жертвенность, застой."},

13:{name:"Смерть",
plus:"Трансформация, обновление.",
minus:"Страх перемен, разрушение."},

14:{name:"Умеренность",
plus:"Баланс, гармония, спокойствие.",
minus:"Пассивность, затягивание."},

15:{name:"Дьявол",
plus:"Сила желаний, деньги, энергия.",
minus:"Зависимости, искушения."},

16:{name:"Башня",
plus:"Освобождение, перезагрузка.",
minus:"Кризисы, разрушения."},

17:{name:"Звезда",
plus:"Надежда, вдохновение, мечты.",
minus:"Иллюзии, отрыв от реальности."},

18:{name:"Луна",
plus:"Интуиция, подсознание.",
minus:"Страхи, тревожность."},

19:{name:"Солнце",
plus:"Успех, радость, энергия.",
minus:"Гордыня, эго."},

20:{name:"Суд",
plus:"Пробуждение, миссия.",
minus:"Страх перемен."},

21:{name:"Мир",
plus:"Завершение, гармония.",
minus:"Застой."},

22:{name:"Шут",
plus:"Свобода, лёгкость, новый путь.",
minus:"Безответственность, хаос."}

};

// расчёт
calcBtn.onclick = ()=>{

  const parts = dateInput.value.split(".");
  if(parts.length!==3){alert("Введите дату");return;}

  let d=+parts[0], m=+parts[1], y=+parts[2];

  function reduce(n){
    while(n>22) n=[...n+""].reduce((a,b)=>a+ +b,0);
    return n;
  }

  const destiny = reduce(reduce(d)+reduce(m)+reduce(y));

  const a = arcana[destiny];

  destiny.innerText = destiny;

  desc.innerHTML = `
    <b>${a.name}</b><br><br>
    <span class="plus">Плюс: ${a.plus}</span><br><br>
    <span class="minus">Минус: ${a.minus}</span>
  `;

  result.classList.remove("hidden");
};

</script>

</body>
</html>
