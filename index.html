<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица судьбы</title>

<style>
body {
  margin: 0;
  background: #f5f5f7;
  font-family: -apple-system;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
}

button {
  background: #007aff;
  color: white;
}

.circle {
  position: relative;
  width: 320px;
  height: 320px;
  margin: 30px auto;
  border-radius: 50%;
  border: 2px solid #d2c2a3;
}

.node {
  position: absolute;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.left { background:#d1c4e9; }
.top { background:#d1c4e9; }
.right { background:#ef9a9a; }
.bottom { background:#ef9a9a; }
.center { background:#aed581; width:50px;height:50px; }

.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
}

.plus {color:green;}
.minus {color:red;}
</style>
</head>

<body>

<div class="app">

<input id="dateInput" placeholder="ДД.ММ.ГГГГ">
<button onclick="calc()">Рассчитать</button>

<div id="matrix" class="circle"></div>
<div id="info"></div>

</div>

<script>

// автоформат
dateInput.addEventListener("input", e=>{
 let v=e.target.value.replace(/\D/g,"");
 if(v.length>2)v=v.slice(0,2)+"."+v.slice(2);
 if(v.length>5)v=v.slice(0,5)+"."+v.slice(5,9);
 e.target.value=v;
});

// редукция
function reduce(n){
 while(n>22){
  n = n.toString().split("").reduce((a,b)=>a+ +b,0);
 }
 return n;
}

// база 22 энергий
const E = {
1:["Маг","Инициатива, лидер","Манипуляции, эго"],
2:["Жрица","Интуиция","Страхи"],
3:["Императрица","Изобилие","Лень"],
4:["Император","Структура","Контроль"],
5:["Иерофант","Знания","Догмы"],
6:["Влюблённые","Любовь","Зависимость"],
7:["Колесница","Цель","Агрессия"],
8:["Справедливость","Баланс","Критика"],
9:["Отшельник","Мудрость","Закрытость"],
10:["Фортуна","Удача","Хаос"],
11:["Сила","Энергия","Гнев"],
12:["Повешенный","Рост","Жертва"],
13:["Смерть","Трансформация","Страх"],
14:["Умеренность","Гармония","Пассивность"],
15:["Дьявол","Деньги","Зависимости"],
16:["Башня","Обнуление","Кризис"],
17:["Звезда","Надежда","Иллюзии"],
18:["Луна","Интуиция","Страх"],
19:["Солнце","Успех","Эго"],
20:["Суд","Пробуждение","Страх"],
21:["Мир","Завершение","Застой"],
22:["Шут","Свобода","Хаос"]
};

// расчёт
function calc(){

 let p=dateInput.value.split(".");
 if(p.length!==3){alert("Введите дату");return;}

 let d = +p[0];
 let m = +p[1];
 let y = p[2].split("").reduce((a,b)=>a+ +b,0);

 let karma = reduce(d+m+y);
 let center = reduce(d+m+y+karma);

 matrix.innerHTML="";

 // позиции
 const pos={
  left:[0,140],
  top:[140,0],
  right:[280,140],
  bottom:[140,280],
  center:[135,135]
 };

 function node(val,cls,x,y){
  let el=document.createElement("div");
  el.className="node "+cls;
  el.style.left=x+"px";
  el.style.top=y+"px";
  el.innerText=val;
  matrix.appendChild(el);
 }

 node(d,"left",...pos.left);
 node(m,"top",...pos.top);
 node(y,"right",...pos.right);
 node(karma,"bottom",...pos.bottom);
 node(center,"center",...pos.center);

 // описание
 function block(title,n){
  let a=E[n];
  return `
  <div class="card">
  <b>${title}: ${n}</b><br>
  <b>${a[0]}</b><br>
  <span class="plus">Плюс: ${a[1]}</span><br>
  <span class="minus">Минус: ${a[2]}</span>
  </div>`;
 }

 info.innerHTML =
 block("Портрет (день)",d)+
 block("Таланты (месяц)",m)+
 block("Карма (год)",y)+
 block("Кармический хвост",karma)+
 block("Центр личности",center);
}

</script>

</body>
</html>
