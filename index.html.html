<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица судьбы</title>
<style>
body {
  margin: 0;
  background: #1c1c1e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.iphone {
  width: 375px;
  height: 812px;
  background: #f2f2f7;
  border-radius: 50px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  position: relative;
}

.notch {
  width: 160px;
  height: 30px;
  background: black;
  border-radius: 20px;
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.status-bar {
  display: flex;
  justify-content: space-between;
  padding: 20px;
  font-size: 14px;
}

.app {
  padding: 20px;
}

h1 {
  text-align: center;
  font-size: 22px;
}

.card {
  background: rgba(255,255,255,0.8);
  padding: 15px;
  border-radius: 18px;
  margin-top: 15px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  background: #007aff;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 16px;
}

.hidden {
  display: none;
}

.big-number {
  font-size: 50px;
  text-align: center;
}

.matrix {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.matrix div {
  background: white;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="iphone">
  <div class="notch"></div>

  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="app">
    <h1>Матрица судьбы</h1>

    <div class="card">
      <label>Дата рождения</label>
      <input id="dateInput" placeholder="ДД.ММ.ГГГГ">
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div id="result" class="hidden">
      <div class="card">
        <div class="big-number" id="destiny"></div>
      </div>

      <div class="card">
        <div class="matrix" id="matrix"></div>
      </div>
    </div>
  </div>
</div>

<script>
function reduceTo22(num) {
  while (num > 22) {
    num = num.toString().split("").reduce((s, d) => s + +d, 0);
  }
  return num;
}

function calculate() {
  const date = document.getElementById("dateInput").value;
  const parts = date.split(".");

  if (parts.length !== 3) {
    alert("Введите дату: ДД.ММ.ГГГГ");
    return;
  }

  const day = +parts[0];
  const month = +parts[1];
  const year = +parts[2];

  const d = reduceTo22(day);
  const m = reduceTo22(month);
  const y = reduceTo22(year);
  const destiny = reduceTo22(d + m + y);

  const matrix = [d, m, y, destiny];

  document.getElementById("destiny").innerText = destiny;

  const box = document.getElementById("matrix");
  box.innerHTML = "";

  matrix.forEach(n => {
    const div = document.createElement("div");
    div.innerText = n;
    box.appendChild(div);
  });

  document.getElementById("result").classList.remove("hidden");
}
</script>

</body>
</html>
